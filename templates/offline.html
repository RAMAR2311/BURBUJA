<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burbuja Lili - Sin Conexión</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=mycase_v1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icons/favicon-32x32.png?v=mycase_v1">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/icons/favicon-16x16.png?v=mycase_v1">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icons/apple-touch-icon.png?v=mycase_v1">
    <meta name="theme-color" content="#FF1493">
    <!-- Google Fonts: Great Vibes, Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --brand-bg: #FFFFFF;
            --brand-white: #FFFFFF;
            --brand-primary: #FF1493;
            --brand-accent: #F472B6;
            --brand-text: #18181B;
            --brand-muted: #71717A;
            --brand-border: #FCE7F3;
            --brand-shadow: 0 10px 25px -5px rgba(255, 20, 147, 0.08), 0 8px 10px -6px rgba(255, 20, 147, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FFFFFF !important;
            color: var(--brand-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .offline-card {
            background: #FFFFFF !important;
            border: 1px solid var(--brand-border);
            border-radius: 24px;
            box-shadow: var(--brand-shadow);
            padding: 2.75rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .offline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #FF1493, #F472B6, #FF69B4);
        }

        .brand-logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #FF1493;
            line-height: 1;
            margin-bottom: 0.15rem;
            text-shadow: 0 2px 10px rgba(255, 20, 147, 0.18);
        }

        .brand-subtitle-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: #F472B6;
            margin-bottom: 1.5rem;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FFF1F7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--brand-primary);
            font-size: 2rem;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.15);
            border: 1px solid #FCE7F3;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--brand-text);
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        p {
            color: var(--brand-muted);
            font-size: 0.92rem;
            line-height: 1.55;
            margin-bottom: 1.75rem;
        }

        .btn-retry {
            background: linear-gradient(135deg, #FF1493 0%, #F472B6 100%);
            color: #FFFFFF !important;
            border: none;
            padding: 0.85rem 1.85rem;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.35);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 20, 147, 0.45);
            filter: brightness(1.05);
        }

        .status-pill {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--brand-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #EF4444;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="mb-2">
            <img src="/static/img/icons/icon-192x192.png?v=burbuja_v2" alt="Burbuja Lili Logo" style="width: 72px; height: 72px; object-fit: contain; border-radius: 18px; box-shadow: 0 4px 15px rgba(255, 23, 68, 0.12); padding: 4px; border: 1px solid #FDE8E8; background: #FFFFFF;">
        </div>
        <div class="brand-logo-text" style="font-family: 'Comfortaa', 'Fredoka', cursive, sans-serif; font-size: 2.2rem; font-weight: 700; color: #FF1744;">Burbuja Lili</div>
        <div class="brand-subtitle-tag" style="letter-spacing: 0.22em; font-weight: 600;">Accesorios para tu celular</div>
        <div class="icon-container">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>Sin Conexión a Internet</h1>
        <p>
            No pudimos sincronizar con el servidor de Burbuja Lili. Por favor verifica tu conexión Wi-Fi o datos móviles.
        </p>
        <button class="btn-retry" onclick="window.location.reload();">
            <i class="fas fa-rotate-right"></i> Reintentar Conexión
        </button>
        <div class="status-pill">
            <span class="status-dot"></span> Modo Fuera de Línea
        </div>
    </div>

    <script>
        // Si vuelve el internet, recargar automáticamente
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
